        status:
          id: status
          table: task
          field: status
          plugin_id: list_field
          operator: or
          value:
            resolved: resolved
            closed: closed
          exposed: false
        title:
          id: title
          table: task
          field: title
          plugin_id: string
          operator: contains
          value: ''
          exposed: true
          expose:
            operator_id: title_op
            label: Task title
            identifier: title
            required: false
      filter_groups:
        operator: AND
