    display_plugin: embed
    display_title: Mine
    position: 1
    display_options:
      defaults:
        arguments: false
      arguments:
        assignee:
          id: assignee
          table: task
          field: assignee
          plugin_id: numeric
          default_action: default
          default_argument_type: current_user
          default_argument_options: {}
