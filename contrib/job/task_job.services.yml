services:
  task_job.config_version_subscriber:
    class: Drupal\task_job\EventSubscriber\JobConfigVersionSubscriber
    arguments: ['@config.storage']
    tags:
      - { name: event_subscriber }
  task_job.version_resolver:
    class: Drupal\task_job\JobVersionResolver
    arguments: ['@entity_type.manager']
  task_job.assignment_subscriber:
    class: Drupal\task_job\EventSubscriber\AssignmentSubscriber
    arguments: ['@task_job.version_resolver', '@task_job.assignment_rules']
    tags:
      - { name: event_subscriber }
  task_job.tempstore_repository:
    class: Drupal\task_job\TaskJobTempstoreRepository
    arguments: ['@tempstore.shared', '@entity_type.manager', '@entity_template.blueprint_tempstore_repository', '@plugin.manager.entity_template.blueprint_provider']
  task_job.collect_resources_subscriber:
    class: Drupal\task_job\EventSubscriber\CollectResourcesSubscriber
    arguments: ['@task.resource_manager']
    tags:
      - { name: event_subscriber }
  plugin.manager.task_job.trigger:
    class: Drupal\task_job\Plugin\JobTrigger\JobTriggerManager
    arguments: ['@container.namespaces', '@cache.discovery', '@module_handler', '@database', '@entity_type.manager', '@logger.factory', '@plugin.manager.task_job.trigger_action']
  plugin.manager.task_job.trigger_action:
    class: Drupal\task_job\TriggerActionManager
    arguments: ['@container.namespaces', '@cache.discovery', '@module_handler', '@context.handler']
  task_job.template_local_tasks:
    class: Drupal\task_job\JobTemplateLocalTasks
    arguments: ['@task_job.tempstore_repository', '@current_route_match']
  task_job.assignment_rules:
    class: Drupal\task_job\AssignmentRules
    arguments: ['@checklist.condition_evaluator', '@context.handler']

  task_job.execution_authorization:
    class: Drupal\task_job\JobExecutionAuthorization
    arguments: ['@keyvalue', '@current_user', '@entity_type.manager', '@config.storage', '@task_job.version_resolver', '@checklist.context_collector', '@context.handler', '@uuid', '@datetime.time']
    tags:
      - { name: event_subscriber }
  task_job.template_contexts:
    class: Drupal\task_job\TemplateContexts
    tags:
      - { name: event_subscriber }

  task_job.template_input_cardinality:
    class: Drupal\task_job\TemplateInputCardinality
    arguments: ['@typed_data_plus.data_fetcher', '@context.repository']
