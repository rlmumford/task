task_job.task_job.*:
  type: config_entity
  label: 'Task Job'
  mapping:
    id:
      type: string
      label: 'Machine-readable name'
    label:
      type: label
      label: 'Label'
    description:
      type: text
      label: 'Description'
    assignment:
      type: string
      label: 'Default assignment rule'
    assignment_rules:
      type: sequence
      label: 'Ordered assignment rules'
      sequence:
        type: mapping
        mapping:
          label:
            type: label
            label: 'Rule label'
          context_mapping:
            type: sequence
            label: 'Context mapping'
            sequence:
              type: string
          condition:
            type: condition.plugin.[id]
            label: 'Condition'
    context:
      type: sequence
      label: 'Task Contexts'
      sequence:
        - type: mapping
          label: 'Task Context'
          mapping:
            type:
              type: string
              label: 'The data type'
            label:
              type: label
              label: 'The context label'
            required:
              type: boolean
              label: 'Whether this context is required.'
            multiple:
              type: boolean
              label: 'Whether this context can have multiple values.'
            description:
              type: string
              label: 'A description of the context'
    resources:
      type: sequence
      sequence:
        type: block.settings.[id]
    default_checklist:
      type: sequence
      label: 'Default checklist'
      sequence:
        type: task_job.checklist_item
    checklist_templates:
      type: sequence
      label: 'Named checklist templates'
      sequence:
        type: mapping
        mapping:
          label:
            type: label
            label: 'Template label'
          items:
            type: sequence
            label: 'Checklist items'
            sequence:
              type: task_job.checklist_item
    checklist_includes:
      type: sequence
      label: 'Statically included checklist templates'
      sequence:
        type: string
    version:
      type: string
      label: 'Named job version'
    version_of:
      type: string
      label: 'Logical job ID'
    dirty:
      type: boolean
      label: 'Working copy'
    code_revision:
      type: integer
      label: 'Revision supplied by code'
    system_revision:
      type: integer
      label: 'Revision in the active system'
    last_imported_hash:
      type: string
      label: 'Hash of the last imported definition'
    active_hash:
      type: string
      label: 'Hash of the active definition'
    triggers:
      type: sequence
      label: 'Triggers'
      sequence:
        - type: task_job.trigger.[id]
          label: 'Trigger'

task_job.trigger:
  type: mapping
  mapping:
    id:
      type: string
      label: 'The trigger plugin id'
    key:
      type: string
      label: 'The trigger key'
    label:
      type: label
      label: 'The trigger description'
    action:
      type: mapping
      label: 'Trigger action'
      mapping:
        plugin:
          type: string
          label: 'Action plugin'
        configuration:
          type: task_job.trigger_action.[%parent.plugin]
    template:
      type: entity_template.template.[id]
      label: 'Template'

task_job.trigger.*:
  type: task_job.trigger
  label: 'Job Trigger'

task_job.trigger.manual:
  type: task_job.trigger
  label: 'Manual Trigger Handler Settings'



task_job.trigger_action.create_task:
  type: mapping
  label: 'Create a task'
  mapping:
    context_mapping:
      type: sequence
      label: 'Context mapping'
      sequence:
        type: string


task_job.checklist_item:
  type: mapping
  label: 'Checklist item'
  mapping:
    name:
      type: string
      label: 'The short name or key'
    label:
      type: label
      label: 'The label of the item'
    handler:
      type: string
      label: 'The handler plugin id'
    execution:
      type: mapping
      label: 'Execution policy'
      mapping:
        mode:
          type: string
          label: 'Self or context-selected execution'
        context_mapping:
          type: sequence
          label: 'Executor context mapping'
          sequence:
            type: string
    handler_configuration:
      type: checklist_item_handler.[%parent.handler]
      label: 'The handler configuration'
