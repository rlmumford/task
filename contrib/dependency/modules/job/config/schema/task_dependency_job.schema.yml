task_job.trigger.dependency_event:*:
  type: task_job.trigger
  label: 'Workflow event trigger'
  mapping:
    event_configuration:
      type: mapping
      label: 'Event matching'
      mapping:
        field:
          type: string
          label: 'State field'
        property:
          type: string
          label: 'State property'
        value:
          type: string
          label: 'Qualifying value'

task_job.trigger_action.retarget_dependencies:
  type: mapping
  label: 'Retarget matching dependencies'
  mapping:
    dependency_trigger:
      type: string
      label: 'Dependency event to move'
    dependency_action:
      type: string
      label: 'Dependency effect to move'
    context_mapping:
      type: sequence
      label: 'Context assignments'
      sequence:
        type: string
